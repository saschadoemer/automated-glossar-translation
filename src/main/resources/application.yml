spring:
  datasource:
    url: jdbc:h2:file:./persistence/glossary;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

translation:
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model-name: ${OPENROUTER_MODEL_NAME:}
